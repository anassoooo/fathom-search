name: Deploy backend (Azure Container Apps)

# On every change to backend/ on main: build the image, publish it to GHCR, roll the
# Azure Container App `vio-search-api` to it, and smoke-test the live URL.
# Azure login uses GitHub OIDC (no stored passwords): see docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io
  id-token: write # OIDC token for azure/login

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/anassoooo/fathom-api
  APP: vio-search-api
  RESOURCE_GROUP: vio-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the container app to the new image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update --name "$APP" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" --only-show-errors \
            --query properties.latestRevisionName -o tsv

      - name: Smoke test
        run: |
          fqdn=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS -m 30 "https://$fqdn/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "health check failed" >&2
          exit 1
