name: Deploy backend (Hugging Face Space)

# Pushes backend/ to the Space named by the repository variable HF_SPACE
# (e.g. "your-username/vio-search-api"). Hugging Face builds the Docker image itself.
# Setup: docs/DEPLOYMENT.md (HF_TOKEN secret + HF_SPACE variable).

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the Space
        run: |
          mkdir space
          cp -r backend/. space/
          rm -rf space/tests space/.env space/.env.*
          # Spaces read their config from YAML front matter in README.md.
          {
            printf -- '---\ntitle: VIO search API\nemoji: 🔎\ncolorFrom: blue\ncolorTo: indigo\n'
            printf -- 'sdk: docker\napp_port: 8000\npinned: false\n---\n\n'
            cat backend/README.md
          } > space/README.md

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
