[project]
name = "vio"
version = "0.1.0"
description = "VIO: evaluation-driven multimodal product search and shopping assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.19,<1.20",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Pick exactly one: `uv sync --extra cpu` (CI, Docker) or `uv sync --extra gpu` (NVIDIA + CUDA 12).
cpu = ["fastembed>=0.5"]
gpu = [
    "fastembed-gpu>=0.5",
    # onnxruntime-gpu 1.31 targets CUDA 13 / cuDNN 9. These pip wheels provide the DLLs,
    # loaded via onnxruntime.preload_dlls(), so no system CUDA install is needed.
    "nvidia-cuda-runtime>=13,<14",
    "nvidia-cublas>=13,<13.8.1",  # 13.8.1 has no Windows wheel
    "nvidia-cudnn-cu13>=9,<10",
    "nvidia-cufft>=12",
    "nvidia-curand>=10",
    "nvidia-cuda-nvrtc>=13,<14",
]

[project.scripts]
vio = "vio.cli:app"

[dependency-groups]
data = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
# `data` holds analysis-only deps (audit, EDA); production images skip it.
default-groups = ["dev", "data"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Statistical notation (σ, τ, μ, θ) in report text is intentional.
"src/vio/quality/derived.py" = ["RUF001", "RUF002"]
"src/vio/quality/figures.py" = ["RUF001", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration' --basetemp=.pytest_tmp"
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]
markers = [
    "integration: needs real external services (Qdrant, LLM); run with -m integration",
    "models: downloads and runs real ONNX models (slow on first run)",
]
