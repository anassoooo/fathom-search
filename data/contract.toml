# Data contract for the VIO catalog (processed CSV, vio_EDA.csv format).
#
# Each [checks."<name>"] entry sets the severity and the acceptable range of that
# check's metric (`min` and/or `max`). Checks not listed here are recorded as `info`.
#   blocking: the dataset must not be ingested
#   warning:  ingest, but affected rows get quality flags and the report calls it out
# Changing a threshold is a reviewed decision: say why in the PR.

[checks."schema.required_columns"]
severity = "blocking"
max = 0

[checks."completeness.required_fields"]
severity = "blocking"
max = 0.0

[checks."completeness.optional_fields"]
severity = "warning"
max = 0.05            # no optional column may be more than 5% empty

[checks."uniqueness.product_id"]
severity = "blocking"
max = 0

[checks."uniqueness.duplicate_listings"]
severity = "warning"
max = 0.20            # duplicates are merged at ingest (ADR-0002); above 20% suggests a scraping problem

[checks."validity.rating_range"]
severity = "blocking"
max = 0

[checks."validity.price_positive"]
severity = "blocking"
max = 0

[checks."validity.review_count"]
severity = "blocking"
max = 0

[checks."validity.price_bucket_domain"]
severity = "blocking"
max = 0

[checks."validity.image_url"]
severity = "warning"
min = 0.99

[checks."validity.rows_parse"]
severity = "blocking"
max = 0

# --- Consistency: can we explain the source's derived columns? (T081) ---
# These pass when the column reproduces from its documented formula. That does not
# make the formula right: the Bayes prior's unit error is documented in ADR-0003.
[checks."consistency.bayes_rating_source"]
severity = "warning"
max = 0.001

[checks."consistency.value_score_source"]
severity = "warning"
max = 0.000001

[checks."consistency.price_bucket_source"]
severity = "warning"
min = 0.99

# --- Plausibility (T082): flagged rows are kept but marked; rates above these suggest a broken scrape ---
[checks."plausibility.price_outlier"]
severity = "warning"
max = 0.03

[checks."plausibility.low_evidence_rating"]
severity = "warning"
max = 0.05

# --- Text integrity (T084) ---
[checks."text.mojibake"]
severity = "warning"
max = 0.001

[checks."text.html_entities"]
severity = "warning"
max = 0.001

[checks."text.brand_only_title"]
severity = "info"     # a property of the source, compensated by image vectors

[checks."text.truncated"]
severity = "warning"
max = 0.01

# --- Label quality (T083) ---
# Mostly taxonomy overlap rather than annotation error (manual audit: 12.5% real errors,
# 72.5% overlap, 15% classifier wrong). Above 8% would indicate a broken category mapping.
[checks."labels.category_disagreement"]
severity = "warning"
max = 0.08
